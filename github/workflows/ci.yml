name: Continuous Integration Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  verify:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]


    steps:

      # Step 1: Download repository code
      - name: Checkout Repository
        uses: actions/checkout@v4


      # Step 2: Install Python versions
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}


      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov


      # Step 4: Run Unit Tests with Coverage
      - name: Run Unit Tests
        run: |
          python -m pytest tests/test_unit.py -v \
            --cov=. \
            --cov-append \
            --cov-report=html:coverage_html \
            --junitxml=test_results_unit.xml
        continue-on-error: true


      # Step 5: Run Integration Tests with Coverage
      - name: Run Integration Tests
        run: |
          python -m pytest tests/test_integration.py -v \
            --cov=. \
            --cov-append \
            --cov-report=html:coverage_html \
            --cov-report=term \
            --junitxml=test_results_integration.xml
        continue-on-error: true


      # Step 6: Coverage Enforcement
      - name: Check Test Coverage
        run: |
          python -m pytest tests/ \
            --cov=. \
            --cov-report=term \
            --cov-fail-under=90


      # Step 7: Upload Coverage HTML Report
      - name: Upload Coverage HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-py${{ matrix.python-version }}
          path: coverage_html/
          retention-days: 30


      # Step 8: Upload Test Results (only if files exist)
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            test_results_unit.xml
            test_results_integration.xml
          retention-days: 30
          if-no-files-found: ignore
